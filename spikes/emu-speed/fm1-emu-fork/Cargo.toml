# fm1-emu-fork: a copy of fm1-emu's fm1-core and fm1-soc (joakimeriksson/fm1-emu 5fbb066, MIT, LICENSE here) with
# the interpreter changes this spike measures (see ../README.md). fm1-isa is used unmodified from the original.
# The same bench as ../bench (its sources), built against these crates.
[workspace]
resolver = "2"
members = ["bench", "crates/fm1-core", "crates/fm1-soc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = false
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
