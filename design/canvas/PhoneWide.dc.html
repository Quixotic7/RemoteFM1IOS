<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RemoteFM1 iPhone landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=DM+Mono:wght@400;500&amp;family=Unbounded:wght@600;700&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:inherit}a:hover{color:inherit}
button{cursor:pointer}
</style>
</helmet>
<main style="position: relative; width: 844px; height: 390px; overflow: hidden; background: {{t.body}}; font-family: 'DM Sans', sans-serif">

<a href="PhoneSheet.dc.html" aria-label="Open controls, or swipe down" style="position: absolute; left: 378px; top: 0; width: 88px; height: 20px; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 5px; border-radius: 3px; background: {{t.label}}; opacity: 0.55"></span></a>

<div style="position: absolute; left: 54px; top: 20px; width: 132px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 2px; justify-items: center">
<dc-import name="Knob" theme="{{themeName}}" size="38" label="Master" angle="70" hint-size="66px,59px"></dc-import>
<dc-import name="Knob" theme="{{themeName}}" size="38" label="Select" angle="-20" hint-size="66px,59px"></dc-import>
<dc-import name="Knob" theme="{{themeName}}" size="38" label="Presets" angle="-120" hint-size="66px,59px"></dc-import>
<dc-import name="Knob" theme="{{themeName}}" size="38" label="Algorithm" angle="30" hint-size="66px,59px"></dc-import>
</div>

<div style="position: absolute; left: 54px; top: 144px; width: 132px; height: 48px; box-sizing: border-box; padding: 3px; display: flex; gap: 4px; background: {{t.bed}}; border-radius: 12px">
<button aria-label="Octave down" style="flex: 1; border: 0; border-radius: 9px; background: {{t.key}}; box-shadow: inset 0 2px 0 {{t.hi}}, 0 3px 0 {{t.lo}}; color: {{t.keyText}}; font: 700 12px/1 'Chakra Petch', sans-serif; letter-spacing: 0.06em">OCT−</button>
<button aria-label="Octave up" style="flex: 1; border: 0; border-radius: 9px; background: {{t.key}}; box-shadow: inset 0 2px 0 {{t.hi}}, 0 3px 0 {{t.lo}}; color: {{t.keyText}}; font: 700 12px/1 'Chakra Petch', sans-serif; letter-spacing: 0.06em">OCT+</button>
</div>

<div style="position: absolute; left: 198px; top: 20px">
<dc-import name="Screen" theme="{{themeName}}" size="172" page="OSC" hint-size="172px,172px"></dc-import>
</div>

<div style="position: absolute; left: 386px; width: 408px; top: 20px; display: flex; align-items: center; justify-content: space-between">
<span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 2px; background: #FF3B2F; box-shadow: 0 0 8px #FF3B2F"></span>
<dc-import name="Knob" theme="{{themeName}}" size="38" label="KN1" angle="-60" hint-size="66px,59px"></dc-import>
<dc-import name="Knob" theme="{{themeName}}" size="38" label="KN2" angle="135" hint-size="66px,59px"></dc-import>
<dc-import name="Knob" theme="{{themeName}}" size="38" label="KN3" angle="0" hint-size="66px,59px"></dc-import>
<dc-import name="Knob" theme="{{themeName}}" size="38" label="KN4" angle="0" hint-size="66px,59px"></dc-import>
</div>

<div style="position: absolute; left: 386px; top: 88px">
<dc-import name="Buttons" theme="{{themeName}}" cols="6" bw="58" bh="38" gap="8" active="" hint-size="408px,104px"></dc-import>
</div>

<div style="position: absolute; left: 50px; top: 206px">
<dc-import name="Keys" theme="{{themeName}}" w="744" h="170" layout="row" mode="play" hint-size="744px,170px"></dc-import>
</div>

</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Tangerine","Midnight","Mint","Lilac","Cream"],"default":"Tangerine"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
const P={Tangerine:{body:'#EE7A3C',label:'#3A1606',bed:'#874332',key:'#924E3A',hi:'#A9614B',lo:'#64301F',keyText:'#FBEDE3',knob:'#1B1715',mark:'#F4EDE6',bezel:'#141210',lcd:'#C9D6EA',ink:'#13203A',led:'#FFE6A8',ledOff:'#6F6668'},Midnight:{body:'#1E2230',label:'#C9D2E6',bed:'#12151D',key:'#2B3244',hi:'#3B4359',lo:'#0A0C12',keyText:'#E6ECF8',knob:'#0A0B0F',mark:'#6CF0C2',bezel:'#05060A',lcd:'#0D1F1A',ink:'#7CF5C8',led:'#6CF0C2',ledOff:'#454B5C'},Mint:{body:'#A8DCC8',label:'#143329',bed:'#2F5B52',key:'#376A60',hi:'#4A7F74',lo:'#1E3F38',keyText:'#EAF7F1',knob:'#1A2421',mark:'#F2FFF9',bezel:'#121816',lcd:'#E9F0D8',ink:'#1E2A17',led:'#FFF3B0',ledOff:'#6E8580'},Lilac:{body:'#C9AEE6',label:'#2A1642',bed:'#573B77',key:'#634486',hi:'#77589B',lo:'#3B2655',keyText:'#F6EFFC',knob:'#1C1624',mark:'#F7F0FF',bezel:'#120E18',lcd:'#D7E3F2',ink:'#1A2236',led:'#FFD6F0',ledOff:'#8A7A9A'},Cream:{body:'#EFE6D2',label:'#2A231C',bed:'#2A2520',key:'#3A332C',hi:'#4B433A',lo:'#141110',keyText:'#F3EBDC',knob:'#E8622A',mark:'#FFF4E8',bezel:'#15120F',lcd:'#F6C34A',ink:'#2A1A05',led:'#FF7A3D',ledOff:'#6A6158'}};
const name = P[this.props.theme] ? this.props.theme : 'Tangerine';
return { t: P[name], themeName: name };
}
}
</script>
</body>
</html>
