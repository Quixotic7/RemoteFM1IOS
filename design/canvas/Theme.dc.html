<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RemoteFM1 theme editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=DM+Mono:wght@400;500&amp;family=Unbounded:wght@600;700&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:inherit}a:hover{color:inherit}
button{cursor:pointer}
</style>
</helmet>
<main style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #17140F; color: #F3EBDC; font-family: 'DM Sans', sans-serif">

<header style="position: absolute; left: 16px; right: 16px; top: 50px; height: 44px; display: flex; align-items: center; justify-content: space-between">
<a href="PhoneSheet.dc.html" style="height: 44px; padding: 0 4px; color: #B5AB99; font: 600 15px/44px 'DM Sans', sans-serif; text-decoration: none">Cancel</a>
<h1 style="margin: 0; font: 700 17px/1 'Unbounded', sans-serif; letter-spacing: -0.01em">Theme</h1>
<a href="Main.dc.html" style="height: 44px; padding: 0 16px; border-radius: 999px; background: #FF8A4C; color: #17140F; font: 700 14px/44px 'DM Sans', sans-serif; text-decoration: none">Done</a>
</header>

<section aria-label="Preview of the full FM-1 layout" style="position: absolute; left: 16px; top: 104px; width: 358px; height: 258px; box-sizing: border-box; padding: 12px; background: {{t.body}}; border-radius: 28px">
<div style="width: 334px; height: 234px; overflow: hidden; border-radius: 16px">
<div style="width: 1194px; height: 834px; transform: scale(0.2797); transform-origin: 0 0">
<dc-import name="PadWide" theme="{{themeName}}" chrome="off" hint-size="1194px,834px"></dc-import>
</div>
</div>
</section>

<h2 style="position: absolute; left: 20px; top: 400px; margin: 0; font: 600 11px/1 'DM Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #A69C8A">Presets</h2>
<div role="radiogroup" aria-label="Preset themes" style="position: absolute; left: 16px; right: 16px; top: 420px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="5">
<button role="radio" aria-checked="{{th.pressed}}" onClick="{{th.pick}}" style="height: 76px; border: 0; border-radius: 18px; background: {{th.tile}}; color: #F3EBDC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 0">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: {{th.body}}; box-shadow: 0 0 0 2px {{th.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{th.bed}}; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{th.led}}"></span></span></span>
<span style="font: 600 11px/1 'DM Sans', sans-serif">{{th.name}}</span>
</button>
</sc-for>
</div>

<h2 style="position: absolute; left: 20px; top: 516px; margin: 0; font: 600 11px/1 'DM Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #A69C8A">Customize</h2>
<div style="position: absolute; left: 16px; right: 16px; top: 536px; background: #211E19; border-radius: 20px; overflow: hidden">
<sc-for list="{{parts}}" as="pt" hint-placeholder-count="5">
<button style="width: 100%; height: 44px; border: 0; border-top: {{pt.line}}; background: transparent; color: #F3EBDC; display: flex; align-items: center; gap: 12px; padding: 0 16px; font: 600 15px/1 'DM Sans', sans-serif; text-align: left">
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: {{pt.color}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18)"></span>
<span style="flex: 1">{{pt.label}}</span>
<span style="font: 500 13px/1 'DM Mono', monospace; color: #B5AB99">{{pt.color}}</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B5AB99" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-for>
</div>

<button style="position: absolute; left: 16px; right: 16px; top: 770px; height: 48px; border-radius: 999px; border: 1px solid #3A352D; background: transparent; color: #F3EBDC; font: 700 15px/1 'DM Sans', sans-serif">Save as my theme</button>

</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Tangerine","Midnight","Mint","Lilac","Cream"],"default":"Tangerine"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const P={Tangerine:{body:'#EE7A3C',label:'#3A1606',bed:'#874332',key:'#924E3A',hi:'#A9614B',lo:'#64301F',keyText:'#FBEDE3',knob:'#1B1715',mark:'#F4EDE6',bezel:'#141210',lcd:'#C9D6EA',ink:'#13203A',led:'#FFE6A8',ledOff:'#6F6668'},Midnight:{body:'#1E2230',label:'#C9D2E6',bed:'#12151D',key:'#2B3244',hi:'#3B4359',lo:'#0A0C12',keyText:'#E6ECF8',knob:'#0A0B0F',mark:'#6CF0C2',bezel:'#05060A',lcd:'#0D1F1A',ink:'#7CF5C8',led:'#6CF0C2',ledOff:'#454B5C'},Mint:{body:'#A8DCC8',label:'#143329',bed:'#2F5B52',key:'#376A60',hi:'#4A7F74',lo:'#1E3F38',keyText:'#EAF7F1',knob:'#1A2421',mark:'#F2FFF9',bezel:'#121816',lcd:'#E9F0D8',ink:'#1E2A17',led:'#FFF3B0',ledOff:'#6E8580'},Lilac:{body:'#C9AEE6',label:'#2A1642',bed:'#573B77',key:'#634486',hi:'#77589B',lo:'#3B2655',keyText:'#F6EFFC',knob:'#1C1624',mark:'#F7F0FF',bezel:'#120E18',lcd:'#D7E3F2',ink:'#1A2236',led:'#FFD6F0',ledOff:'#8A7A9A'},Cream:{body:'#EFE6D2',label:'#2A231C',bed:'#2A2520',key:'#3A332C',hi:'#4B433A',lo:'#141110',keyText:'#F3EBDC',knob:'#E8622A',mark:'#FFF4E8',bezel:'#15120F',lcd:'#F6C34A',ink:'#2A1A05',led:'#FF7A3D',ledOff:'#6A6158'}};
const st = this.state || {};
const name = st.theme || (P[this.props.theme] ? this.props.theme : 'Tangerine');
const t = P[name];
const themes = Object.keys(P).map((k) => ({
name: k, body: P[k].body, bed: P[k].bed, led: P[k].led,
pressed: k === name ? 'true' : 'false',
tile: k === name ? '#2A251F' : 'transparent',
ring: k === name ? '#FF8A4C' : 'transparent',
pick: () => this.setState({ theme: k }),
}));
const parts = [['Faceplate', t.body], ['Keys and buttons', t.key], ['Knobs', t.knob], ['LEDs', t.led], ['Display', t.lcd]].map(([label, color], i) => ({
label, color, line: i === 0 ? '0' : '1px solid #2E2A23',
}));
return { t, themeName: name, themes, parts };
}
}
</script>
</body>
</html>
