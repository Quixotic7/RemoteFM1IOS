<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RemoteFM1 linked: big screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=DM+Mono:wght@400;500&amp;family=Unbounded:wght@600;700&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<main style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{t.body}}; font-family: 'DM Sans', sans-serif">

<header style="position: absolute; left: 16px; right: 16px; top: 50px; height: 32px; display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 999px; background: rgba(0,0,0,0.14); color: {{t.label}}; font: 600 12px/1 'DM Sans', sans-serif">
<span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #3BD47A"></span>FM-1 linked</span>
<a href="PhoneSheet.dc.html" aria-label="Open controls, or swipe down" style="position: absolute; left: 50%; top: -6px; width: 88px; height: 44px; margin-left: -44px; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 5px; border-radius: 3px; background: {{t.label}}; opacity: 0.55"></span></a>
<span style="font: 700 12px/1 'Chakra Petch', sans-serif; letter-spacing: 0.14em; color: {{t.label}}">SCREEN</span>
</header>

<div style="position: absolute; left: 16px; top: 243px">
<dc-import name="Screen" theme="{{themeName}}" size="358" page="OSC" hint-size="358px,358px"></dc-import>
</div>

</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Tangerine","Midnight","Mint","Lilac","Cream"],"default":"Tangerine"},"$preview":{"width":390,"height":844}}'>

renderVals() {

const name = P[this.props.theme] ? this.props.theme : 'Tangerine';
return { t: P[name], themeName: name };
}
}
</script>
</body>
</html>
